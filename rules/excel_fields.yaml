# 엑셀 필드 사전 — 형식: ripple/ingest/fields.py, 설계: docs/input.md(엑셀 양식) 4절
# 회사마다 다른 엑셀 머리글·시트 이름을 지정 양식 열로 맞출 때 쓰는 제품 지식이다(열 자동 매핑의 '사전 일치' 특징).
# 일반 조선·구매 용어로 만든 가정이고, 현업 엑셀 머리글을 받으면 더한다. 변형 생성기 어휘
# (generator/excel_variants.yaml)와 따로 쓴다 — 평가에서 사전에 없는 머리글의 비율과 정확도를 따로 본다.
# 비공개 현업 구매·재고 엑셀에서 본 일반 용어(블럭번호·발주일자·자재번호·Mark No)와 SAP 필드명(별칭 후보:
#   IDNRK·MENGE·MEINS·EBELN·EBELP)은 동의어로, 양식에 없는 흔한 열(납기·미납·금액·담당·적치장 등)은 other_headers로 둔다.
#   회사 자료 자체는 저장소에 넣지 않는다.
# 값으로 가를 수 없는 열(늘 비어 있는 가공일(확인), 같은 모양의 ID 두 열인 선후행)은 영어·약어 머리글(Processing Date·
#   Successor·SUCC·PRED 등)도 동의어로 둔다 — 관문 변형(V1)이 지도·난수에 따라 우연히 통과하지 않게.
# range: 양식 단위 기준 상식 범위[하한, 상한]. 이상값 검출에만 쓴다(단위를 모르는 열을 범위로 정하지 않는다).
#        넉넉하게 잡아 실제 값은 막지 않고 단위 착오(1000배)를 잡는다. 벗어나면 가져오기 오류.
# shape: 글자 항목의 값 모양(id 식별자 · code 짧은 표기 · text 글). 열 매핑의 값 모양 특징에만 쓴다(가정, 현업 엑셀로 확인).
# 규격 시트의 원산지 구분·운송 방식(외자재): 발주대장에 같은 뜻의 열(내외자·운송)이 있어도 계산은
#   규격 시트 값만 쓴다(발주의 '입고까지'는 이미 운송을 포함한 리드타임).
