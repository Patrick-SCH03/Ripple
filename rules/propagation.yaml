# 전파 규칙표 — 형식: ripple/contracts/rulebook.py
# 판단 로직은 엔진의 같은 ID 함수에 있고(테스트 대상), 이 파일은 규칙의 범위·문턱값·출처만 담는다.
# relation은 ripple/contracts/domain.py의 Relation 값이다. 값을 바꾸면 version을 올린다.
version: rules-v5
updated: 2026-10-27
# v5: 블록 단계에 PE(선행도장 → PE → 탑재), R-B01 산식에 블록 난이도 계수와 작업반 몫 나누기·도장 뒤 고정 항목(C-04)을
#     적음(docs/engine.md(비용·일정) 4-4). 판단 로직·범위·조건은 그대로(PE도 '소조립 이후'라 재작업 대상)
# v4: R-S01 조건에 (다) 의장품 선상 설치 수요(관문 대상이 구역 출구, docs/engine.md(비용·일정) 6-3·7절 v1.17). 그 밖의 규칙은 그대로
# v3: R-S01·R-H01의 조건·메모 문구를 계산 명세(docs/engine.md(비용·일정) 6-3·7·8-3)와 맞춤. 판단 로직·범위는 그대로
#     (2단계 관문 손 계산이 적은 명세 모호 A5: 옛 문구는 '가장 늦은 시작일' 기준이었다)
# v2: R-S01·R-H01의 연산을 실제로 계산하는 범위로 좁힘(새 자재가 생기는 연산 / 발주 변경·취소가 생길 수 있는 연산),
#     R-T01 메모에 자재비 차이(비용 규칙 C-01)와의 관계. 1단계 규칙의 범위·조건은 그대로. 계산 의미는 docs/engine.md(비용·일정)
# v1: R-T01에 장비 사양 변경 추가, R-M02(빼는 부재의 발주 감축) 추가, R-M01 두 방향 명시, R-B01·R-D01이 이어서 바뀌는 부재에도 적용,
#     R-X01 부재 종류별 필수 관계. 전파 의미는 docs/engine.md(전파)

rules:
  - id: R-T01
    ops: [thickness, grade, equipment_spec]
    relation: supplied_by
    when: "확정일 기준 발주 품목 단계가 '발주' 이후"
    effect: [po_change, reorder]
    severity: high
    note: "규격이 바뀌면 기존 품목은 단계별 비용으로 변경·취소하고 새 규격을 급히 다시 발주(할증). 미발주면 발주할 규격만 바꿈(영향 없음). 새 규격 자재비 차이는 비용 규칙 C-01(docs/engine.md(비용·일정) 4절)"

  - id: R-M02
    ops: [remove_part, reroute_pipe]
    relation: supplied_by
    when: "확정일 기준 발주 품목 단계가 '발주' 이후"
    effect: [po_change]
    note: "빼는 부재(부재 삭제, 경로 변경에서 빼는 스풀)의 품목은 수량 감축·취소. 남는 자재는 R-M01로 전용 후보를 찾음"

  - id: R-T02
    ops: [thickness]
    relation: butt_weld
    when: "변경 뒤 맞대기 판 사이 두께 차가 문턱값 이상"
    effect: [taper]
    settings:
      threshold_mm:
        thin_plate_le_10mm: 3.0
        thin_plate_gt_10mm: 4.0
      taper_length_ratio:
        parallel_to_stress: 3
        perpendicular_to_stress: 4
      max_thickness_diff_ratio: 0.5  # 두께 차 ≤ 두꺼운 판의 50%
    source: "BV NR600 Ch7 Sec2 [3.2.2](2026-03), KR 강선규칙 10편 1장 308(2026) — 원문 미수록, 조항 번호만 인용"

  - id: R-T03
    ops: [thickness]
    relation: fillet_weld
    when: "항상"
    effect: [weld_recheck]
    severity: low

  - id: R-T04
    ops: [thickness, add_penetration]
    relation: penetration
    when: "항상"
    effect: [collar_resize]
    note: "두께가 바뀐 판을 지나는 배관, 새 관통부를 지나는 배관의 칼라·슬리브"

  - id: R-B01
    ops: [thickness, grade, dimension, add_part, remove_part, reroute_pipe, equipment_spec, add_penetration]
    relation: part_of
    when: "확정일 기준 블록 단계가 '소조립' 이후"
    effect: [rework]
    severity: high
    settings:
      also_from: [taper, collar_resize, modify_part]  # 이 영향을 받은 이웃 부재도 바뀌는 부재로 봄
    note: "재작업 공수 = 영향 중량 × 단계까지의 원 작업 공수 × params rework_multiplier[블록 단계] × 블록 난이도 계수(difficulty.*). 작업반이 맡은 공정 몫은 작업반 추가 공비 줄로 나누고(금액 같음), 선행도장 이후 단계면 도장 뒤 고정 항목(C-04)을 더함"

  - id: R-D01
    ops: [thickness, grade, dimension, add_part, remove_part, reroute_pipe, equipment_spec, add_penetration]
    relation: drawn_in
    when: "항상"
    effect: [drawing_revision]
    severity: low
    settings:
      also_from: [taper, collar_resize, modify_part]

  - id: R-S01
    ops: [thickness, grade, add_part, reroute_pipe, equipment_spec]  # 새 자재가 생기는 연산(docs/engine.md(비용·일정) 5절)
    relation: consumed_by
    when: "(가) 판정일에 착수 전인 소비 공정으로 가는 새 자재의 도착일 + 1, 또는 (나) 이미 착수한 소비 공정이면 max(판정일 + 1, 도착일) + 그 블록 재작업 일수가 관문 대상(그 블록 탑재, 이미 탑재했으면 구역 출구)의 기준 착수일보다 늦음, 또는 (다) 선상 설치 요청의 선상 설치 수요면 max(도착일 + 1, 탑재 기준 완료일) + 선상 설치 일수가 그 블록 탑재 후행(구역 출구)의 기준 착수일보다 늦음(docs/engine.md(비용·일정) 5·6-3·7절)"
    effect: [schedule_delay]
    severity: high

  - id: R-H01
    ops: [thickness, grade, equipment_spec, remove_part, reroute_pipe]  # 발주 변경·취소가 생길 수 있는 연산
    relation: consumed_by
    when: "출발 부재를 공급하는 품목의 발주(요청에서 아직 보류하지 않은 것)의 보류 가능 기간이 1일 이상이고, 그만큼 보류한 곡선이 탐색 기간 안에서 손실을 줄임(docs/engine.md(비용·일정) 8-3)"
    effect: [po_hold]
    note: "보류 가능 기간 = 기준일에 착수 전인 소비 공정마다 (블록 탑재를 늦추지 않는 가장 늦은 착수일 − 보류 없는 입고 대표일)의 최솟값. 보류 곡선 전체와 비교해 피하는 손실이 가장 큰 날로 권고하고 보류 뒤 마감일을 함께 냄"

  - id: R-M01
    ops: [thickness, grade, dimension, remove_part]
    relation: same_spec
    when: "변경 뒤 규격과 같은 가공 전 재고가 있음, 또는 변경으로 남는 입고·가공 전 자재와 같은 규격의 다른 블록 수요가 탐색 기간 안에 있음"
    effect: [reallocate_stock]
    note: "전용되면 취급비(params stock.reallocation_handling_per_t)만 든다. 두 방향의 정확한 조건은 docs/engine.md(전파)"

  - id: R-L01
    ops: [thickness, grade, dimension, add_part, remove_part, reroute_pipe, equipment_spec, add_penetration]
    relation: precedes
    when: "구역 출구 이정표 지연이 경계 조건의 여유를 넘음(경계 조건이 있을 때만)"
    effect: [delivery_delay]
    severity: high
    note: "지체상금 = 선가 × 일당 비율 × (변경 후 − 변경 전 지체상금 대상 일수), 유예·최대 일수 반영(docs/domain.md 5절)"

  - id: R-P01
    ops: [equipment_spec]
    relation: pipe_joint
    when: "새 사양의 연결 규격(플랜지 등급·구경)이 기존과 다름"
    effect: [modify_part]
    note: "인접 스풀의 플랜지·개스킷 교체"

  - id: R-P02
    ops: [reroute_pipe]
    relation: penetration
    when: "새 경로가 판을 관통"
    effect: [modify_part, collar_resize]
    severity: high
    note: "구조 관통부 추가는 설계자 확인 필요로 표시"

  - id: R-P03
    ops: [reroute_pipe]
    relation: support
    when: "빼거나 옮기는 스풀을 받치던 서포트가 있음"
    effect: [modify_part]
    severity: low

  - id: R-X01
    ops: [thickness, grade, dimension, add_part, remove_part, reroute_pipe, equipment_spec, add_penetration]
    relation: any
    when: "대상 부재에 그 종류라면 늘 있어야 하고 이 연산의 규칙이 따라가는 관계가 통째로 없음"
    effect: [needs_confirmation]
    settings:
      required_relations:  # 부재 종류별로 늘 있어야 하는 관계
        plate: [part_of, supplied_by, drawn_in, butt_weld]
        stiffener: [part_of, supplied_by, drawn_in, fillet_weld]
        bracket: [part_of, supplied_by, drawn_in, fillet_weld]
        collar: [part_of, drawn_in, penetration]
        pipe_spool: [part_of, supplied_by, drawn_in, pipe_joint]
        valve: [part_of, supplied_by, drawn_in, pipe_joint]
        pipe_support: [part_of, supplied_by, drawn_in, support]
        equipment: [part_of, supplied_by, drawn_in]
    note: "계산에서 빼고 '확인 필요'로 표시(예선 계획서 약속). 같은 종류 연결 중 일부만 빠진 경우는 탐지 불가"
