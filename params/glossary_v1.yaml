# 현장 통보문 번역 초안(계약 1.36.0, ripple/contracts/translation.py · ripple/explain/translate.py, docs/records.md(통보) 6절).
# 결재 뒤 사내 협력사 작업반에 보내는 통보 메일만 번역한다. 외부 AI 호출 없이 이 파일의 고정 문장·용어만 쓴다(real 모드도 같음).
#
# 언어 더하기: languages에 코드(영문 소문자 2~3자) 하나를 넣고, sentences · metrics · terms의 모든 줄에 그 코드 값을 넣는다.
#   빠진 줄이 있으면 앱이 시작하지 않는다(계약 검증 + 템플릿 자리 수 검사, tests/checks/translate.py).
# 문장 규칙: 숫자를 쓰지 않는다(값은 {0} 자리로만 들어온다). {0} 자리 수는 한국어 템플릿(ripple/explain/templates.py)과 같게.
# 용어: 엔터티 이름(공정·부재·작업반)의 한국어 조선 용어를 바꾼다. 길게 맞는 말이 먼저다(판넬조립 > 판). 없는 말은 한국어 그대로.
#   위에서부터의 순서가 메일 끝 '주요 용어' 순서다(두 글자 이상만 싣는다).
# 표기: 번역 머리에 원문 우선 문장만 둔다(번역 보기에 한국어 원문을 덧붙이지 않음 — 11-04)(11-03 사용자 결정 — '초안' 표기 없음).
version: glossary-v1
notice_ko: 번역과 한국어 원문이 다르면 원문이 우선합니다.
languages:
  en:
    name: English
    notice: >-
      If this translation differs from the Korean original, the Korean original prevails.
    original_mark: "[Korean]"
  vi:
    name: Tiếng Việt
    notice: >-
      Nếu bản dịch khác với bản gốc tiếng Hàn, bản gốc tiếng Hàn được ưu tiên.
    original_mark: "[Tiếng Hàn]"

sentences:
  # 메일 머리·끝(템플릿 밖)
  frame.subject.crew:
    en: "[Design change review] {0} {1} – advance notice of work change"
    vi: "[Xem xét thay đổi thiết kế] {0} {1} – thông báo trước về thay đổi công việc"
  frame.salutation:
    en: "Dear Foreman of {0},"
    vi: "Kính gửi Tổ trưởng {0},"
  frame.reference:
    en: Reference
    vi: Liên quan
  frame.hull:
    en: "Hull {0}"
    vi: "Tàu {0}"
  frame.source:
    en: "Original document {0}"
    vi: "Văn bản gốc {0}"
  frame.cause:
    en: "Cause of change: {0}"
    vi: "Nguyên nhân thay đổi: {0}"
  frame.sign_off:
    en: Best regards,
    vi: Trân trọng,
  frame.terms:
    en: ■ Key terms (Korean – English)
    vi: ■ Thuật ngữ chính (tiếng Hàn – tiếng Việt)
  # 작업반 메일 본문(ripple/explain/templates.py의 같은 ID)
  mail.crew.intro:
    en: A design change is under review for the work below that your crew has carried out, so we are sharing it in advance.
    vi: Một thay đổi thiết kế đang được xem xét đối với các công đoạn dưới đây mà tổ của quý vị đã thực hiện, vì vậy chúng tôi xin thông báo trước.
  mail.heading.activity:
    en: ■ Affected work stages
    vi: ■ Công đoạn liên quan
  mail.heading.part:
    en: ■ Members being changed
    vi: ■ Cấu kiện thay đổi
  mail.heading.schedule:
    en: ■ Confirmation schedule
    vi: ■ Lịch xác nhận
  mail.heading.request:
    en: ■ Requests
    vi: ■ Yêu cầu
  mail.item.activity:
    en: "- {0}"
    vi: "- {0}"
  mail.item.part:
    en: "- {0}"
    vi: "- {0}"
  mail.crew.status:
    en: "- Please reply with the current status of that work (what is completed and what is in progress)."
    vi: "- Vui lòng phản hồi tình trạng hiện tại của công đoạn đó (phần đã hoàn thành và phần đang thực hiện)."
  mail.crew.subcontract:
    en: "- The changed work will be instructed again in writing after confirmation, and payment for the additional work will be agreed in advance (Korean Subcontracting Act)."
    vi: "- Phần việc thay đổi sẽ được chỉ thị lại bằng văn bản sau khi xác nhận, và chi phí cho phần việc phát sinh sẽ được thỏa thuận trước (Luật thầu phụ Hàn Quốc)."
  mail.crew.closing:
    en: Once the change is confirmed, we will send you a new work order.
    vi: Khi thay đổi được xác nhận, chúng tôi sẽ gửi lại phiếu giao việc mới.
  mail.thanks:
    en: Thank you for your cooperation.
    vi: Cảm ơn quý vị đã hợp tác.

metrics:
  timing.deadline:
    en: Decision deadline
    vi: Hạn quyết định

