# 합성 NCR 묶음(시연용, docs/records.md '합성 NCR') 만들기 설정 — ripple/cases/ncr.py
#
# 실제 NCR(부적합 보고) 이력이 없다. 사전 점검 항목 옆 '같은 유형 합성 NCR n건'과 결정 도우미에 보이는 시연 재료이고,
# 모든 문장에 '합성 묶음(시연)'을 적는다. 건수만 보인다(비율·대표 손실 금액 없음). 실데이터 모드에서는 만들지 않는다.
# 아래 값은 모두 **근거 없는 시연용 가정**이다(현업 의견에서 들은 사례 유형만 따옴). 바꾸면 판(version)을 올린다.
version: ncr-v1

count: 36 # 묶음 건수(번호 NCR-S-0001 ~)
recent: 5 # 요약에 싣는 최근 건수 기본값(번호 큰 순)

# 유형 비율(가정): 사전 점검 규칙 6종(P-01~P-06) + 기타 2종(X-01 치수·취부 오차, X-02 자재 착오)
types:
  P-01: 0.12 # 설치 시점 — 선행의장 뒤 의장품 변경 → 후행 설치(현업 사례 1 유형)
  P-02: 0.16 # 관통부 정합 — 관통부·칼라 누락
  P-03: 0.10 # 블록 경계 연결 — 경계 배관 연결부 간섭
  P-04: 0.16 # 분야 간 도면 — 다른 분야 도면 미반영(분야별 자기 도면만 봄)
  P-05: 0.08 # 새 스풀 서포트 — 서포트 누락
  P-06: 0.18 # 현장 공유 — 도면 반영 뒤 현장 미공유 → 도장 뒤 추가 시공(현업 사례 2 유형)
  X-01: 0.12 # 기타: 치수·취부 오차
  X-02: 0.08 # 기타: 자재 착오

crew_share: 0.6 # 조치 공정을 맡을 작업반이 있을 때 작업반이 조치한 비율(나머지는 직영, 생성기 crews.share와 같은 가정)
