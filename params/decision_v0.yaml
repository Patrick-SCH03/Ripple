# 판단 계층 목표값 v0 — 형식: ripple/contracts/decision.py, 설계: docs/input.md(판단 계층)
# 합격 기준(E8)을 보기 전에 고정한 값이다. 바꾸면 version을 올린다.
version: decision-v0
updated: 2026-10-08
# 변경 사유는 요청 문에 넣지 않고 따로 정한다(사유 문 intent — 분석 먼저, 사유는 뒤에).

targets:
  alpha: 0.05  # 되묻기 집합 미포함률(포함률 0.95)
  delta: 0.10  # 자동 진행 보장이 틀릴 확률
  epsilon:  # 문마다 자동 진행 단위의 오류율 상한(단위 안 판단이 하나라도 틀리면 오답)
    request: 0.03  # 변경 요청 하나(대상·연산)
    column: 0.03  # 엑셀 열 하나
    intent: 0.03  # 변경 사유 하나(자동 진행이면 분석 뒤 바로 기록)
  max_choices: 7  # 고르기 화면에 보여 줄 최대 후보 수
  # 검정 순서. 온도 분할의 단위 신뢰도에서 이 비율만큼 위에 있는 값을 문턱으로 삼아 차례로 검정한다
  coverage_levels: [0.2, 0.3, 0.4, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95]

# 2단계 보정 스크립트(ripple.decide.policy.calibrate_gate)가 채운다. 최종 인증은 한 번만 한다.
topics: []
gates: []
