# 비용 파라미터 v1 — 형식: ripple/contracts/params.py, 쓰는 곳: docs/engine.md(비용·일정)
# 모든 값은 가정 범위의 대표값이다. status: evidence(근거 있음, 출처 필수) / assumption(가정) / mentor(현업 확인값)
# status·source·mentor_question은 묶음에 적으면 아래 값들이 물려받는다.
# mentor_question은 docs/data.md(현업 확인 질문)의 질문 번호다. 값을 바꾸면 version을 올린다.
# 파일 이름은 설정·검사 경로(RIPPLE_PARAMS_PATH 기본값) 호환 때문에 cost_v1.yaml 그대로 두고, 판은 version으로 센다.
# 강종 단가 비율·후판 참고 단가는 비공개 현업 강재 재고 집계로 보정한 값이다(원자료·집계 노트는 저장소 밖). 현업에서 확인한
# 톤당 30MH · 5만원/MH · 하루 80MH(10명) · 재작업 배수 1~5는 status mentor, 그 밖의 새 가정값은 현업 확인 질문(Q22)으로 확인한다.
