# 합성 과거 사례(시연용, docs/records.md '합성 과거 사례') 만들기 설정 — ripple/cases/
#
# 숫자는 지어내지 않는다:
# - 예측(총변경비용·구역 출구 지연·추가손실 0 마감일) = 엔진(ripple/engine)이 그 사례를 분석한 값
# - 실적(실제 비용·구역 출구 지연) = 같은 세계의 숨긴 실제 모델(ripple/generator/actuals, actuals-v2,
#   docs/data.md(생성기) 6-1)이 그 결정(확정일·발주 보류)으로 계산한 값 — 오차 분포를 따로 정하지 않는다
# 여기서 정하는 것은 결정 종류와 결정 시점을 뽑는 비율·범위뿐이고, 모두 **근거 없는 시연용 가정**이다
# (실제 결재 이력이 없다). 바꾸면 묶음이 바뀌므로 판(version)을 올린다.
version: cases-v1

count: 30 # 과거 사례 수. 재료 = 개발 분할(dev) 설계변경 중 화면 샘플이 아닌 것(약 180건)에서 연산 비율대로

# 결정 종류 비율(가정 — 결재까지 온 설계변경은 대개 실행한다고 보고 반려·보류를 적게 둔다).
# 할 수 있는 것 중에서만 뽑는다 — 발주 보류는 엔진의 보류 권고가 있을 때만(없으면 나머지 비율로).
# 대안으로 승인은 대안 계산을 끈 묶음이라(만드는 시간) 넣지 않는다. 선상 설치는 숨긴 모델이 다루지 않아 넣지 않는다.
decisions:
  as_requested: 0.72 # 요청대로 승인
  hold_po: 0.15 # 발주 보류 뒤 승인(엔진 보류 권고의 최대 보류 일수로)
  reject: 0.08 # 반려(실행하지 않아 실적 없음)
  hold: 0.05 # 결정 보류(끝나지 않아 실적 없음)

# 결정 시점(가정): 엔진의 추가손실 0 마감일 기준
timing:
  late_share: 0.3 # 마감 뒤에 결정한 비율
  early_max_days: 10 # 마감 전 결정: 마감 0~10일 전(균등, 기준일보다 앞서지 않게)
  late_max_days: 10 # 마감 뒤 결정: 1~10일 뒤(균등, 곡선 끝을 넘지 않게)
  no_deadline_max_days: 20 # 탐색 기간 안에 손실이 없는 사례: 기준일 + 0~20일

# 비슷한 정도(결정적 점수): 변경 연산 종류가 같은 사례만 보고, 아래 점수 합이 문턱 이상인 것만 점수 순으로.
# 같은 블록(6) + 같은 구역(2)이 다른 블록 사례의 최대(2+2+1+1)보다 커서 같은 블록이 늘 앞에 온다.
similarity:
  block: 6 # 바뀌는 부재의 블록이 하나라도 같음
  zone: 2 # 그 블록의 구역이 같음
  system: 2 # 배관 계통이 같음
  intent: 1 # 변경 목적(사유)이 같음 — 생성 자료에는 변경 원인이 늘 비어 있어 목적을 쓴다
  size: 1 # 변경 크기가 가까움(가까운 정도 0~1을 곱함)
  size_close: 0.5 # 이 이상 가까우면 '비슷한 크기'로 적는다
  threshold: 2 # 이보다 낮으면 빼서 억지 사례를 보이지 않는다

keep_maps: 3 # 지도 ID마다 기억하는 묶음 수(실시간 시연 세계는 날마다 지도가 바뀐다)
