name: CI
on:
  push:
    branches: [main, release]  # release = 라이브 배포 브랜치(Railway는 이 CI를 기다리지 않음 — 배포 관문은 로컬 CI·push 전 훅)
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.5"
          enable-cache: true
      - name: 의존성 설치(uv.lock 그대로)
        run: uv sync --locked
      - name: 린트·포맷
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: 타입 검사(strict)
        run: uv run mypy
      - name: 성질 검사 — 서버·키 없이
        run: uv run python tests/check_all.py

  gates:  # 손 계산 관문 회귀(docs/gate_cases.md) — 엔진·명세를 바꾸고 정답을 갱신하지 않으면 여기서 멈춘다
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.5"
          enable-cache: true
      - name: 의존성 설치(uv.lock 그대로)
        run: uv sync --locked
      - name: 관문 채점 — 1단계 영향·2단계 비용·일정·3단계 대안
        run: |
          uv run python scripts/gate_cases.py score --stage 1
          uv run python scripts/gate_cases.py score --stage 2
          uv run python scripts/gate_cases.py score --stage 3

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 의존성 설치(package-lock 그대로)
        run: npm ci
      - name: API 타입이 docs/api/openapi.json과 같음
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts
      - name: 린트·타입 검사
        run: |
          npm run lint
          npm run typecheck
      - name: 화면 계산 검사
        run: npm test
      - name: 빌드
        run: npm run build

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: 배포 이미지 빌드(API·화면)
        env:
          RIPPLE_BUILD: ${{ github.sha }}
          NEO4J_PASSWORD: build-only  # compose 파일 해석용(빌드에는 쓰지 않음)
        run: docker compose -p ripple build
      - name: 컨테이너 스모크 — 화면·로그인·권한·볼륨·다시 만들기
        run: python3 scripts/smoke_compose.py --build "${{ github.sha }}"
